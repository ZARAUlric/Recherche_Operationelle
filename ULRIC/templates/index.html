<!DOCTYPE html>
<html>
<head>
<title>Affectation</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

<h1>Problème d'affectation</h1>

<label>Taille de la matrice :</label>
<input type="number" id="size" value="3">

<br><br>

<button onclick="generateMatrix()">Générer</button>

<form action="/calculate" method="POST">

<input type="hidden" name="size" id="sizeInput">

<div id="matrix"></div>

<br>

<select name="mode">
<option value="min">Minimisation</option>
<option value="max">Maximisation</option>
</select>

<br><br>

<button type="submit">Calculer</button>

</form>

</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
